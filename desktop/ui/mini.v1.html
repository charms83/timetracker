<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; connect-src http://127.0.0.1:3747 http://localhost:3747">
<title>Zeitprotokoll</title>
<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --line:#e5e5ea; --text:#1d1d1f; --text2:#6e6e73; --text3:#a1a1a6;
  --accent:#0f752f; --accent-soft:rgba(15,117,47,.10); --sel:#dfe6fb;
  --pause:#f5c242; --pause-text:#5a4300; --stop:#d9453b; --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1e1e20; --card:#2a2a2d; --line:#3a3a3d; --text:#f5f5f7; --text2:#a1a1a6; --text3:#6e6e73; --sel:#33395a; --accent-soft:rgba(80,200,120,.14); --pause-text:#3b2c00; }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:13px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:var(--text);background:var(--bg);display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%;outline:none;-webkit-user-select:text;user-select:text}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* Kopf */
.head{height:44px;display:flex;align-items:center;gap:6px;padding:0 10px 0 14px;-webkit-app-region:drag;border-bottom:1px solid var(--line)}
.head h1{flex:1;font-size:14px;font-weight:600;text-align:center}
.head button{-webkit-app-region:no-drag;width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.head button:hover{background:var(--accent-soft)}
.head .close{color:var(--text3)}
svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Erinnerung */
.reminder{display:none;margin:10px 12px 0;padding:10px 12px;border-radius:var(--radius);background:#fff4d6;color:#5a4300;border:1px solid #f1d98a;animation:pop .25s ease}
@media (prefers-color-scheme: dark){.reminder{background:#3d3316;color:#f5e2a8;border-color:#5c4c1d}}
.reminder b{display:block;margin-bottom:8px}
.reminder .row{display:flex;gap:6px}
.reminder button{padding:5px 10px;border-radius:6px;background:rgba(0,0,0,.07);font-weight:500}
.reminder button.primary{background:var(--accent);color:#fff}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}

/* Läuft-Karte */
.now{margin:10px 12px 0;padding:12px 14px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:12px}
.now.running{background:var(--sel);border-color:transparent;box-shadow:inset 3px 0 0 var(--bar,#4a6cf7)}
.now.paused{background:#fff4d6;border-color:#f1d98a}
@media (prefers-color-scheme: dark){.now.paused{background:#3d3316;border-color:#5c4c1d}}
.now .info{flex:1;min-width:0}
.now .p{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .s{color:var(--text2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .clock{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* Schnellstart */
.quick{margin:10px 12px 0;padding:12px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line)}
.quick .grid{display:grid;grid-template-columns:1.4fr 1fr;gap:6px;margin-bottom:6px}
.quick .go{display:flex;gap:6px}
.quick .go input{flex:1}
.btn-start{background:var(--accent);color:#fff;border-radius:7px;padding:0 14px;font-weight:600;white-space:nowrap}
.btn-start:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:5px;flex-wrap:nowrap;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;max-width:230px}
.chip{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--bg);border:1px solid var(--line);color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip i{font-style:normal;display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:var(--c)}

/* Tag */
.dayhead{display:flex;align-items:center;gap:8px;padding:14px 14px 6px}
.dayhead .nav{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.dayhead .nav:hover{background:var(--line)}
.dayhead .d{flex:1;font-weight:600}
.dayhead .sum{text-align:right;color:var(--text2);font-size:12px;line-height:1.25}
.dayhead .sum b{color:var(--text);font-size:13px}
.timeline{position:relative;height:6px;margin:0 14px 6px;border-radius:3px;background:var(--line);overflow:hidden}
.timeline span{position:absolute;top:0;bottom:0;border-radius:3px}
.list{flex:1;overflow:auto;padding:0 12px 8px}
.entry{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 12px;margin-bottom:4px;border-radius:8px;background:var(--card);border:1px solid var(--line);box-shadow:inset 3px 0 0 var(--c)}
.entry .info{flex:1;min-width:0}
.entry .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .m{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .dur{font-variant-numeric:tabular-nums;color:var(--text2);font-size:12px;white-space:nowrap}
.entry .again{opacity:0;color:var(--accent);width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center}
.entry:hover .again{opacity:1}
.entry.pause{box-shadow:inset 3px 0 0 var(--pause);background:transparent}
.entry.ssh{box-shadow:inset 3px 0 0 #8e8e93;background:transparent}
.empty{color:var(--text3);text-align:center;padding:24px 0}
.tag{display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;margin-left:4px;color:#fff;background:var(--c)}

/* Fuß */
.foot{display:flex;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--line)}
.foot button{flex:1;height:40px;border-radius:9px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.b-pause{background:var(--pause);color:var(--pause-text)}
.b-stop{background:var(--stop);color:#fff}
.foot button:disabled{opacity:.35;cursor:default}

/* Nachtrag */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;align-items:flex-start;justify-content:center;padding-top:50px;z-index:10}
.modal .box{width:calc(100% - 24px);background:var(--card);border-radius:12px;padding:14px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal h2{font-size:14px;margin-bottom:10px}
.modal label{display:block;font-size:11px;color:var(--text2);margin:8px 0 3px}
.modal .row{display:flex;gap:6px}
.modal .actions{display:flex;justify-content:flex-end;gap:6px;margin-top:14px}
.modal .actions button{padding:6px 14px;border-radius:7px;background:var(--bg);font-weight:500}
.modal .actions .primary{background:var(--accent);color:#fff}
.err{color:var(--stop);font-size:12px;margin-top:6px;min-height:14px}
.offline{margin:30px 16px;text-align:center;color:var(--text2)}
</style>
</head>
<body>
<div class="head">
  <button id="bAdd" title="Zeit nachtragen"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button id="bMain" title="Hauptfenster öffnen"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
  <h1>Zeiterfassung</h1>
  <button id="bRefresh" title="Aktualisieren"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
  <button id="bClose" class="close" title="Ausblenden (kommt zur Erinnerung wieder)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<div class="reminder" id="reminder">
  <b id="remText">Woran arbeitest du gerade?</b>
  <div class="row" id="remBtns"></div>
</div>

<div id="app">
  <div class="now" id="now"></div>

  <div class="quick" id="quick">
    <div class="grid">
      <select id="qProject"></select>
      <input id="qTicket" placeholder="Ticket, z.B. ISMS-123" list="ticketList" autocomplete="off">
      <datalist id="ticketList"></datalist>
    </div>
    <div class="go">
      <input id="qComment" placeholder="Was machst du?" autocomplete="off">
      <button class="btn-start" id="qStart">Start</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="dayhead">
    <button class="nav" id="prevDay"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="d" id="dayLabel"></div>
    <button class="nav" id="nextDay"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <div class="sum" id="daySum"></div>
  </div>
  <div class="timeline" id="timeline"></div>
</div>
<div class="list" id="list"></div>

<div class="foot">
  <button class="b-pause" id="bPause"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg><span>Pause</span></button>
  <button class="b-stop" id="bStop"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg><span>Stopp</span></button>
</div>

<div class="modal" id="modal"><div class="box">
  <h2>Zeit nachtragen</h2>
  <label>Projekt</label><select id="mProject"></select>
  <label>Ticket (optional)</label><input id="mTicket" placeholder="z.B. ISMS-123" list="ticketList">
  <label>Datum</label><input id="mDate" type="date">
  <div class="row">
    <div style="flex:1"><label>Von</label><input id="mFrom" type="time"></div>
    <div style="flex:1"><label>Bis</label><input id="mTo" type="time"></div>
  </div>
  <label>Tätigkeit</label><input id="mComment" placeholder="Was wurde gemacht?">
  <div class="err" id="mErr"></div>
  <div class="actions"><button id="mCancel">Abbrechen</button><button class="primary" id="mSave">Speichern</button></div>
</div></div>

<script src="mini.js"></script>
</body>
</html>
