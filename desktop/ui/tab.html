<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Zeitprotokoll</title>
<style>
:root{ --bg:#ffffffee; --line:#00000014; --text:#1d1d1f; --text2:#6e6e73; --green:#0f752f; --pause:#c98a00; --idle:#9a9aa0; --shadow:0 4px 18px rgba(0,0,0,.18); }
@media (prefers-color-scheme: dark){ :root{ --bg:#2a2a2dee; --line:#ffffff1a; --text:#f5f5f7; --text2:#a1a1a6; } }
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:transparent;overflow:hidden}
body{font:11px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;color:var(--text);-webkit-user-select:none;user-select:none}
#tab{
  position:absolute; inset:0 0 0 0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  background:var(--bg); border:1px solid var(--line); border-right:none; border-radius:14px 0 0 14px; box-shadow:var(--shadow);
  cursor:pointer; -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); transition:transform .15s ease;
}
#tab:active{ transform:scale(0.96); }
#tab.dragging{ cursor:grabbing; transform:none; border-right:1px solid var(--line); border-radius:14px; }
body.left #tab{ border-right:1px solid var(--line); border-left:none; border-radius:0 14px 14px 0; }
body.left #chev{ transform:rotate(180deg); }
body.left #chev.expanded{ transform:none; }
body.left #toast{ right:auto; left:100%; margin-right:0; margin-left:8px; transform:translateY(-50%) translateX(-6px); }
body.left #toast.show{ transform:translateY(-50%) translateX(0); }
#grip{ width:16px; height:3px; border-radius:2px; background:var(--text2); opacity:.35; margin-bottom:2px; }
#tab:hover #grip{ opacity:.7; }
#dot{ width:9px; height:9px; border-radius:50%; background:var(--idle); box-shadow:0 0 0 0 rgba(0,0,0,0); transition:background .2s; }
#dot.running{ background:var(--green); }
#dot.pause{ background:var(--pause); }
#clock{ font-variant-numeric:tabular-nums; font-weight:600; font-size:11px; color:var(--text); white-space:nowrap; }
#chev{ color:var(--text2); font-size:12px; line-height:1; margin-top:2px; transition:transform .2s; }
#chev.expanded{ transform:rotate(180deg); }

@keyframes peek {
  0%   { transform:translateX(0); }
  15%  { transform:translateX(-13px); }
  30%  { transform:translateX(0); }
  45%  { transform:translateX(-8px); }
  60%  { transform:translateX(0); }
  100% { transform:translateX(0); }
}
#tab.peeking{ animation:peek 1.4s ease; }
#tab.peeking #dot{ box-shadow:0 0 0 6px rgba(15,117,47,.28); }
#tab.peeking #dot.pause{ box-shadow:0 0 0 6px rgba(201,138,0,.28); }
#tab.peeking #dot.idle{ box-shadow:0 0 0 6px rgba(154,154,160,.28); }

#toast{
  position:absolute; right:100%; top:50%; transform:translateY(-50%) translateX(6px); margin-right:8px; width:208px;
  background:var(--bg); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:10px 12px;
  opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
}
#toast.show{ opacity:1; transform:translateY(-50%) translateX(0); pointer-events:auto; }
#toast b{ display:block; font-size:12px; margin-bottom:2px; }
#toast span{ color:var(--text2); font-size:10px; }
</style>
</head>
<body>
<div id="tab" title="Klicken: Zeiterfassung ein-/ausklappen · Ziehen: Lasche verschieben (auch auf andere Bildschirme)">
  <div id="grip"></div>
  <div id="dot" class="idle"></div>
  <div id="clock"></div>
  <div id="chev">‹</div>
  <div id="toast"><b id="toastText"></b><span>Klicken zum Öffnen</span></div>
</div>
<script src="tab.js"></script>
</body>
</html>
