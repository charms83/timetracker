# Vorlage – NICHT mit echten Werten einchecken. Anlegen z. B. mit:
#   oc create secret generic zeitprotokoll-secrets \
#     --from-literal=DATABASE_URL='postgres://zeitprotokoll:<passwort>@db.example.com:5432/zeitprotokoll?sslmode=verify-full' \
#     --from-literal=ZP_SECRET_KEY="$(head -c 48 /dev/urandom | base64)"
# ZP_SECRET_KEY (mind. 32 Zeichen) verschlüsselt alle Tokens in der Datenbank: sicher aufbewahren (Tresor), nie ändern ohne Neuverschlüsselung.
# Optional: ZP_SETUP_TOKEN (sonst zufällig, steht im Log beim Start).
apiVersion: v1
kind: Secret
metadata:
  name: zeitprotokoll-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgres://zeitprotokoll:CHANGEME@db.example.com:5432/zeitprotokoll?sslmode=verify-full"
  ZP_SECRET_KEY: "CHANGEME-mindestens-32-zufaellige-zeichen"
