<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeitprotokoll – Einrichtung</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1a1d21; --mut:#6b7280; --line:#d6d9de; --acc:#0d6e5b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1214; --fg:#e6e8eb; --mut:#9aa3ad; --line:#2a3036; --acc:#2fb99c; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:32px 16px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.mut, small { color:var(--mut); }
  label { display:block; margin:16px 0 4px; font-weight:600; }
  input[type=text], input[type=password] { width:100%; box-sizing:border-box; padding:9px 10px; border:1px solid var(--line); border-radius:6px; background:transparent; color:inherit; font:inherit; }
  .mode { display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line); border-radius:8px; padding:12px; margin:10px 0; cursor:pointer; }
  .mode input { margin-top:4px; }
  .mode b { display:block; }
  button { margin-top:20px; padding:10px 18px; border:0; border-radius:6px; background:var(--acc); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  #oidc { display:none; }
  #msg { margin-top:14px; min-height:1.4em; }
  .err { color:#c0392b; } .ok { color:var(--acc); }
</style>
</head>
<body>
<main>
  <h1>Zeitprotokoll-Server einrichten</h1>
  <p class="mut" id="state">Lade Status …</p>

  <label for="token">Einrichtungs-Token</label>
  <input type="password" id="token" autocomplete="off" placeholder="steht im Server-Log beim Start">

  <label>Anmeldung</label>
  <label class="mode"><input type="radio" name="mode" value="local" checked>
    <span><b>Lokale Konten (Einzelbetrieb)</b><small>Anmeldung mit Benutzername und Passwort. Für Installation, Tests und den Einzelbetrieb einer Person. Es gibt den lokalen Administrator „admin“; weitere Mitarbeitende brauchen später LDAP/AD oder authentik.</small></span></label>
  <label class="mode"><input type="radio" name="mode" value="none">
    <span><b>Ohne Anmeldung (Test)</b><small>Ein lokaler Benutzer, nur erreichbar von diesem Rechner. Nicht für den Betrieb auf OpenShift.</small></span></label>
  <label class="mode"><input type="radio" name="mode" value="oidc">
    <span><b>SSO über OIDC (authentik)</b><small>Anmeldung der Personen über den Identity-Provider.</small></span></label>

  <div id="localadmin">
    <label for="apw">Passwort des lokalen Administrators</label>
    <input type="password" id="apw" autocomplete="new-password" placeholder="mindestens 12 Zeichen, drei Zeichenarten">
  </div>
  <div id="oidc">
    <label for="issuer">Issuer-URL</label>
    <input type="text" id="issuer" placeholder="https://auth.example.com/application/o/zeitprotokoll/">
    <label for="client">Client-ID</label>
    <input type="text" id="client" autocomplete="off">
    <label for="secret">Client-Secret</label>
    <input type="password" id="secret" autocomplete="off" placeholder="leer lassen = bisherigen Wert behalten">
  </div>

  <label>Plane</label>
  <p class="mut">Adresse und Workspace gelten für alle; den API-Schlüssel trägt jede Person selbst im Profil ein.</p>
  <label for="pbase">Plane-Adresse</label>
  <input type="text" id="pbase" placeholder="https://plane.example.com">
  <label for="pws">Workspace</label>
  <input type="text" id="pws" placeholder="example">

  <button id="save">Speichern</button>
  <div id="msg"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const mode = () => document.querySelector('input[name=mode]:checked').value;
const sync = () => { $('oidc').style.display = mode() === 'oidc' ? 'block' : 'none'; $('localadmin').style.display = mode() === 'local' ? 'block' : 'none'; };
document.querySelectorAll('input[name=mode]').forEach(r => r.addEventListener('change', sync));
$('token').value = new URLSearchParams(location.search).get('token') || '';

fetch('/api/setup/status?token=' + encodeURIComponent($('token').value)).then(r => r.json()).then(s => {
  $('state').textContent = s.setup_done ? 'Bereits eingerichtet (Modus: ' + s.auth_mode + '). Änderungen sind mit dem Token möglich.' : 'Noch nicht eingerichtet.';
  if (s.auth_mode) document.querySelector('input[name=mode][value=' + s.auth_mode + ']').checked = true;
  if (s.oidc_issuer) $('issuer').value = s.oidc_issuer;
  if (s.plane_base_url) $('pbase').value = s.plane_base_url;
  if (s.plane_workspace) $('pws').value = s.plane_workspace;
  if (s.oidc_client) $('client').value = s.oidc_client;
  sync();
});

$('save').addEventListener('click', async () => {
  const m = $('msg'); m.className = ''; m.textContent = 'Speichere …';
  const res = await fetch('/api/setup', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: $('token').value, auth_mode: mode(), oidc_issuer: $('issuer').value, oidc_client_id: $('client').value, oidc_client_secret: $('secret').value, admin_password: $('apw').value, plane_base_url: $('pbase').value, plane_workspace: $('pws').value })
  });
  const j = await res.json().catch(() => ({}));
  if (res.ok) { m.className = 'ok'; m.textContent = 'Gespeichert.'; $('secret').value = ''; }
  else { m.className = 'err'; m.textContent = j.error || ('Fehler ' + res.status); }
});
sync();
</script>
</body>
</html>
